# UFH tanque: clock and Home Assistant entities. Settings live in the configurator (NVS).
substitutions:
  timezone: Europe/Lisbon

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

api:
  reboot_timeout: 0s

number:
  - platform: template
    name: "Tank Target"
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    mode: box
    min_value: 30
    max_value: 44
    step: 0.5
    update_interval: 5s
    lambda: return id(tank_ctl).target();
    set_action:
      - lambda: id(tank_ctl).set_target(x);
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 6
  - platform: template
    name: "Tank Cutoff"
    icon: mdi:thermometer-alert
    unit_of_measurement: "°C"
    mode: box
    min_value: 35
    max_value: 45
    step: 0.5
    update_interval: 5s
    lambda: return id(tank_ctl).cut();
    set_action:
      - lambda: id(tank_ctl).set_cut(x);
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 7
  - platform: template
    name: "Compressor Zero Delay"
    icon: mdi:timer-alert-outline
    unit_of_measurement: min
    mode: box
    min_value: 5
    max_value: 120
    step: 1
    update_interval: 5s
    lambda: return id(tank_ctl).comp_zero_min();
    set_action:
      - lambda: id(tank_ctl).set_comp_zero_min((uint16_t) x);
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 8

switch:
  - platform: template
    name: "Manual Heater"
    icon: mdi:radiator
    restore_mode: DISABLED
    lambda: return id(tank_ctl).heater_manual();
    turn_on_action:
      - lambda: id(tank_ctl).set_heater_manual(true);
    turn_off_action:
      - lambda: id(tank_ctl).set_heater_manual(false);
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 5

binary_sensor:
  - platform: template
    name: "Tank Pump"
    device_class: running
    icon: mdi:pump
    lambda: return id(tank_ctl).pump_on();
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 2
  - platform: template
    name: "Emergency Heater"
    device_class: heat
    icon: mdi:radiator
    lambda: return id(tank_ctl).heater_on();
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 3
  - platform: template
    name: "Heat Pump Fault"
    device_class: problem
    icon: mdi:alert
    lambda: |-
      int s = id(tank_ctl).heat_pump_fault_state();
      if (s < 0) return {};
      return s == 1;
    web_server:
      sorting_group_id: group_altherma
      sorting_weight: 1
  - platform: template
    name: "Compressor Stopped Warning"
    device_class: problem
    icon: mdi:engine-off
    lambda: return id(tank_ctl).compressor_zero_warn();
    web_server:
      sorting_group_id: group_altherma
      sorting_weight: 2
  - platform: template
    name: "Problem"
    device_class: problem
    lambda: return id(tank_ctl).problem();
    web_server:
      sorting_group_id: group_house

text_sensor:
  - platform: template
    name: "Warnings"
    icon: mdi:alert-outline
    update_interval: 10s
    lambda: |-
      const std::string &w = id(tank_ctl).warnings_text();
      return w.empty() ? std::string("-") : w;
    web_server:
      sorting_group_id: group_house
  - platform: template
    name: "UFH Link"
    icon: mdi:lan
    update_interval: 5s
    lambda: |-
      const char *p = id(tank_ctl).ufh_provider();
      if (!p || !p[0]) return std::string("pick");
      return std::string(id(tank_ctl).ufh_fresh() ? "udp" : "none");
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 4
  - platform: template
    name: "Altherma Link"
    icon: mdi:lan
    update_interval: 5s
    lambda: |-
      const char *p = id(tank_ctl).altherma_provider();
      if (!p || !p[0]) return std::string("pick");
      return std::string(id(tank_ctl).altherma_fresh() ? "udp" : "none");
    web_server:
      sorting_group_id: group_altherma
      sorting_weight: 5

sensor:
  - platform: template
    name: "Tank Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer-water
    update_interval: 15s
    lambda: return id(tank_ctl).tank_temp();
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 1
  - platform: template
    name: "Pump PWM"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:sine-wave
    update_interval: 5s
    lambda: return id(tank_ctl).pwm_duty();
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 10
  - platform: template
    name: "Open Zones"
    accuracy_decimals: 0
    icon: mdi:heating-coil
    update_interval: 5s
    lambda: |-
      int n = id(tank_ctl).open_zones();
      if (n < 0) return {};
      return (float) n;
    web_server:
      sorting_group_id: group_tank
      sorting_weight: 11
  - platform: template
    name: "Compressor Frequency"
    unit_of_measurement: Hz
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sine-wave
    update_interval: 15s
    lambda: return id(tank_ctl).compressor_freq();
    web_server:
      sorting_group_id: group_altherma
      sorting_weight: 4
  - platform: template
    name: "Outdoor Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer
    update_interval: 60s
    lambda: return id(tank_ctl).outdoor_temp();
    web_server:
      sorting_group_id: group_altherma
      sorting_weight: 3
