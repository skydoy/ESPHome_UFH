# Entities of one zone (var: zone). Created for every relay of the board; zones that do not
# exist (zone count set in the setup wizard) are hidden at boot. Names come from the wizard.
# Each zone has its own group on the web page ("Zone N", opened / closed by web-ui.js).
climate:
  - platform: ufh
    zone: ${zone}
    name: "Zone ${zone}"
    icon: mdi:home-thermometer-outline
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 1

button:
  - platform: ufh
    zone: ${zone}
    name: "Zone ${zone} Boost"
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 2

switch:
  - platform: ufh
    zone: ${zone}
    name: "Zone ${zone} Follows Main"
    entity_category: config
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 3

binary_sensor:
  - platform: ufh
    zone: ${zone}
    name: "Zone ${zone} Heating"
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 4

sensor:
  - platform: ufh
    type: temperature
    zone: ${zone}
    name: "Zone ${zone} Temperature"
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 5
  - platform: ufh
    type: last_reading
    zone: ${zone}
    name: "Zone ${zone} Last Reading"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 6
  - platform: ufh
    type: runtime_today
    zone: ${zone}
    name: "Zone ${zone} Runtime Today"
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 7
  - platform: ufh
    type: runtime_total
    zone: ${zone}
    name: "Zone ${zone} Runtime Total"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 8
  - platform: ufh
    type: duty_24h
    zone: ${zone}
    name: "Zone ${zone} Duty 24h"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 9
  - platform: ufh
    type: heating_rate
    zone: ${zone}
    name: "Zone ${zone} Heating Rate"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 10
  - platform: ufh
    type: cooling_rate
    zone: ${zone}
    name: "Zone ${zone} Cooling Rate"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_zone${zone}
      sorting_weight: 11
