# Entities of one zone (var: zone). Created for every relay of the board; zones that do not
# exist (zone count set in the setup wizard) are hidden at boot. Names come from the wizard.
climate:
  - platform: ufh
    zone: ${zone}
    name: "Zone ${zone}"
    icon: mdi:home-thermometer-outline
    web_server:
      sorting_group_id: group_zones

binary_sensor:
  - platform: ufh
    zone: ${zone}
    name: "Zone ${zone} Heating"
    web_server:
      sorting_group_id: group_zones

sensor:
  - platform: ufh
    type: temperature
    zone: ${zone}
    name: "Zone ${zone} Temperature"
    web_server:
      sorting_group_id: group_zones
  - platform: ufh
    type: runtime_today
    zone: ${zone}
    name: "Zone ${zone} Runtime Today"
    web_server:
      sorting_group_id: group_stats
  - platform: ufh
    type: runtime_total
    zone: ${zone}
    name: "Zone ${zone} Runtime Total"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_stats
  - platform: ufh
    type: duty_24h
    zone: ${zone}
    name: "Zone ${zone} Duty 24h"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_stats
