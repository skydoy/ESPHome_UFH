# UFH controller: global entities, clock, MQTT listener and Home Assistant actions.
# The heating logic is the C++ component in components/ufh (configured by the relay package of
# the board, see core/relays/). Everything else (zones, names, sensors, schedules, options) is
# set in the setup wizard on the device web page.
substitutions:
  timezone: Europe/Lisbon

# Clock for schedules: SNTP (works without Home Assistant). Home Assistant also syncs the time
# and the time zone when it is connected.
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

# MQTT: only connects when the wizard sets a broker and a zone (or the solar signal) uses MQTT.
# No discovery and no state topics: Home Assistant talks to the device through the API.
mqtt:
  broker: mqtt.invalid
  enable_on_boot: false
  discovery: false
  topic_prefix: null
  log_topic: null
  reboot_timeout: 0s

select:
  - platform: template
    id: house_mode
    name: "House Mode"
    icon: mdi:home-switch-outline
    options: ["Home", "Away", "Holiday", "Summer"]
    update_interval: 2s
    lambda: |-
      static const char *const M[] = {"Home", "Away", "Holiday", "Summer"};
      return std::string(M[id(ufh_ctl).house_mode() & 3]);
    set_action:
      - lambda: |-
          static const char *const M[] = {"Home", "Away", "Holiday", "Summer"};
          for (uint8_t i = 0; i < 4; i++) if (x == M[i]) id(ufh_ctl).set_house_mode(i);
    web_server:
      sorting_group_id: group_house
  - platform: template
    id: pump_mode
    name: "Pump Mode"
    icon: mdi:pump
    options: ["Auto", "On", "Off"]
    update_interval: 2s
    lambda: |-
      static const char *const M[] = {"Auto", "On", "Off"};
      uint8_t m = id(ufh_ctl).pump_mode();
      return std::string(M[m > 2 ? 0 : m]);
    set_action:
      - lambda: |-
          static const char *const M[] = {"Auto", "On", "Off"};
          for (uint8_t i = 0; i < 3; i++) if (x == M[i]) id(ufh_ctl).set_pump_mode(i);
    web_server:
      sorting_group_id: group_house

binary_sensor:
  - platform: template
    name: "Pump"
    device_class: running
    icon: mdi:pump
    lambda: return id(ufh_ctl).pump_on();
    web_server:
      sorting_group_id: group_house
  - platform: template
    name: "Heat Demand"
    device_class: heat
    icon: mdi:fire
    lambda: return id(ufh_ctl).heat_demand();
    web_server:
      sorting_group_id: group_house
  - platform: template
    name: "Problem"
    device_class: problem
    lambda: return id(ufh_ctl).problem();
    web_server:
      sorting_group_id: group_house

text_sensor:
  - platform: template
    name: "Warnings"
    icon: mdi:alert-outline
    update_interval: 10s
    lambda: |-
      const std::string &w = id(ufh_ctl).warnings_text();
      return w.empty() ? std::string("-") : w;
    web_server:
      sorting_group_id: group_house
  - platform: template
    name: "Active Zones"
    icon: mdi:heating-coil
    update_interval: 5s
    lambda: return id(ufh_ctl).active_zones_text();
    web_server:
      sorting_group_id: group_house

sensor:
  - platform: template
    name: "Pump Runtime Today"
    unit_of_measurement: h
    device_class: duration
    accuracy_decimals: 2
    icon: mdi:timer-outline
    update_interval: 60s
    lambda: return id(ufh_ctl).pump_today_h();
    web_server:
      sorting_group_id: group_stats
  - platform: template
    name: "Pump Runtime Total"
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    icon: mdi:timer-sand
    entity_category: diagnostic
    update_interval: 300s
    lambda: return id(ufh_ctl).pump_total_h();
    web_server:
      sorting_group_id: group_stats

button:
  - platform: template
    name: "All Zones Off"
    icon: mdi:radiator-off
    on_press:
      - lambda: id(ufh_ctl).all_zones_off();
    web_server:
      sorting_group_id: group_house

# Actions for Home Assistant (Developer tools -> Actions), e.g. esphome.<device>_set_zone_temperature
api:
  actions:
    # Temperature from any Home Assistant sensor (source "Home Assistant" in the wizard;
    # blueprint: blueprints/automation/esphome_ufh_temperature_from_ha.yaml)
    - action: set_zone_temperature
      variables: { zone: int, temperature: float }
      then:
        - lambda: id(ufh_ctl).ha_set_zone_temperature(zone, temperature);
    - action: set_floor_temperature
      variables: { zone: int, temperature: float }
      then:
        - lambda: id(ufh_ctl).ha_set_floor_temperature(zone, temperature);
    # Solar surplus (option "Solar surplus"): true while there is surplus
    - action: set_pv_surplus
      variables: { surplus: bool }
      then:
        - lambda: id(ufh_ctl).ha_set_pv_surplus(surplus);
    # mode: 0 = off, 1 = auto (schedule), 2 = heat (fixed target)
    - action: set_zone_mode
      variables: { zone: int, mode: int }
      then:
        - lambda: id(ufh_ctl).ha_set_zone_mode(zone, mode);
    - action: set_zone_target
      variables: { zone: int, temperature: float }
      then:
        - lambda: id(ufh_ctl).ha_set_zone_target(zone, temperature);
    - action: all_zones_off
      then:
        - lambda: id(ufh_ctl).all_zones_off();
