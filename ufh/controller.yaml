# UFH controller: global entities, clock, MQTT listener and Home Assistant actions.
# The heating logic is the C++ component in components/ufh (configured by the relay package of
# the board, see core/relays/). Everything else (zones, names, sensors, schedules, options) is
# set in the setup wizard on the device web page.
substitutions:
  timezone: Europe/Lisbon

# Clock for schedules: SNTP (works without Home Assistant). Home Assistant also syncs the time
# and the time zone when it is connected.
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

# MQTT: only connects when the wizard sets a broker and a zone (or the solar signal) uses MQTT.
# No discovery and no state topics: Home Assistant talks to the device through the API.
mqtt:
  broker: mqtt.invalid
  enable_on_boot: false
  discovery: false
  topic_prefix: null
  log_topic: null
  reboot_timeout: 0s

# Main thermostat ("Geral"): Comfort / Eco temperatures and its own schedule. Zones with
# "Follows Main" on take their target from it (and cannot be changed one by one).
climate:
  - platform: ufh
    zone: 0
    name: "Main Thermostat"
    icon: mdi:home-thermometer
    web_server:
      sorting_group_id: group_main
      sorting_weight: 1

select:
  - platform: template
    id: house_mode
    name: "House Mode"
    icon: mdi:home-switch-outline
    options: ["Home", "Away", "Holiday", "Summer"]
    update_interval: 2s
    lambda: |-
      static const char *const M[] = {"Home", "Away", "Holiday", "Summer"};
      return std::string(M[id(ufh_ctl).house_mode() & 3]);
    set_action:
      - lambda: |-
          static const char *const M[] = {"Home", "Away", "Holiday", "Summer"};
          for (uint8_t i = 0; i < 4; i++) if (x == M[i]) id(ufh_ctl).set_house_mode(i);
    web_server:
      sorting_group_id: group_house
  - platform: template
    id: pump_mode
    name: "Pump Mode"
    icon: mdi:pump
    options: ["Auto", "On", "Off"]
    update_interval: 2s
    lambda: |-
      static const char *const M[] = {"Auto", "On", "Off"};
      uint8_t m = id(ufh_ctl).pump_mode();
      return std::string(M[m > 2 ? 0 : m]);
    set_action:
      - lambda: |-
          static const char *const M[] = {"Auto", "On", "Off"};
          for (uint8_t i = 0; i < 3; i++) if (x == M[i]) id(ufh_ctl).set_pump_mode(i);
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 3

# Pump / heat pump relay delays after the thermostats' demand (seconds). The thermostats decide;
# these only shift when the relay follows them.
number:
  - platform: template
    name: "Pump Start Delay"
    icon: mdi:timer-play-outline
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 900
    step: 10
    entity_category: config
    update_interval: 5s
    lambda: return id(ufh_ctl).pump_start_s();
    set_action:
      - lambda: id(ufh_ctl).set_pump_start_s((uint16_t) x);
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 4
  - platform: template
    name: "Pump Stop Delay"
    icon: mdi:timer-stop-outline
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 900
    step: 10
    entity_category: config
    update_interval: 5s
    lambda: return id(ufh_ctl).pump_stop_s();
    set_action:
      - lambda: id(ufh_ctl).set_pump_stop_s((uint16_t) x);
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 5
  # heat pump anti short-cycle (relay with the heat demand function), minutes; 0 = off
  - platform: template
    name: "Heat Pump Min On Time"
    icon: mdi:timer-lock-outline
    unit_of_measurement: min
    mode: box
    min_value: 0
    max_value: 60
    step: 1
    entity_category: config
    update_interval: 5s
    lambda: return id(ufh_ctl).hp_min_on_s() / 60.0f;
    set_action:
      - lambda: id(ufh_ctl).set_hp_min_on_s((uint16_t) (x * 60));
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 6
  - platform: template
    name: "Heat Pump Min Off Time"
    icon: mdi:timer-lock-open-outline
    unit_of_measurement: min
    mode: box
    min_value: 0
    max_value: 60
    step: 1
    entity_category: config
    update_interval: 5s
    lambda: return id(ufh_ctl).hp_min_off_s() / 60.0f;
    set_action:
      - lambda: id(ufh_ctl).set_hp_min_off_s((uint16_t) (x * 60));
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 7
  # boost (zone buttons): how much and for how long
  - platform: template
    name: "Boost Temperature"
    icon: mdi:rocket-launch-outline
    unit_of_measurement: "°C"
    mode: box
    min_value: 0.5
    max_value: 5
    step: 0.5
    entity_category: config
    update_interval: 5s
    lambda: return id(ufh_ctl).boost_delta();
    set_action:
      - lambda: id(ufh_ctl).set_boost_delta(x);
    web_server:
      sorting_group_id: group_main
      sorting_weight: 2
  - platform: template
    name: "Boost Duration"
    icon: mdi:timer-outline
    unit_of_measurement: min
    mode: box
    min_value: 10
    max_value: 480
    step: 5
    entity_category: config
    update_interval: 5s
    lambda: return id(ufh_ctl).boost_min();
    set_action:
      - lambda: id(ufh_ctl).set_boost_min((uint16_t) x);
    web_server:
      sorting_group_id: group_main
      sorting_weight: 3

switch:
  # optimum start begins earlier when it is cold outside (outdoor temperature from
  # ESPHome_Altherma or the Home Assistant action set_outdoor_temperature)
  - platform: template
    name: "Outdoor Compensation"
    icon: mdi:snowflake-thermometer
    entity_category: config
    lambda: return id(ufh_ctl).outdoor_comp();
    turn_on_action:
      - lambda: id(ufh_ctl).set_outdoor_comp(true);
    turn_off_action:
      - lambda: id(ufh_ctl).set_outdoor_comp(false);
    web_server:
      sorting_group_id: group_main
      sorting_weight: 4

binary_sensor:
  - platform: template
    name: "Pump"
    device_class: running
    icon: mdi:pump
    lambda: return id(ufh_ctl).pump_on();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 1
  - platform: template
    name: "Heat Demand"
    device_class: heat
    icon: mdi:fire
    lambda: return id(ufh_ctl).heat_demand();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 2
  - platform: template
    name: "Problem"
    device_class: problem
    lambda: return id(ufh_ctl).problem();
    web_server:
      sorting_group_id: group_house

text_sensor:
  - platform: template
    name: "Warnings"
    icon: mdi:alert-outline
    update_interval: 10s
    lambda: |-
      const std::string &w = id(ufh_ctl).warnings_text();
      return w.empty() ? std::string("-") : w;
    web_server:
      sorting_group_id: group_house
  - platform: template
    name: "Active Zones"
    icon: mdi:heating-coil
    update_interval: 5s
    lambda: return id(ufh_ctl).active_zones_text();
    web_server:
      sorting_group_id: group_house

sensor:
  # heat pump water (ESPHome_Altherma link) and outdoor temperature
  - platform: template
    name: "Flow Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer-chevron-up
    update_interval: 30s
    lambda: return id(ufh_ctl).flow_temp();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 10
  - platform: template
    name: "Return Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer-chevron-down
    update_interval: 30s
    lambda: return id(ufh_ctl).return_temp();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 11
  - platform: template
    name: "Flow Return Difference"
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:delta
    update_interval: 30s
    lambda: return id(ufh_ctl).flow_delta();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 12
  - platform: template
    name: "Outdoor Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer
    update_interval: 60s
    lambda: return id(ufh_ctl).outdoor_temp();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 13
  - platform: template
    name: "Pump Runtime Today"
    unit_of_measurement: h
    device_class: duration
    accuracy_decimals: 2
    icon: mdi:timer-outline
    update_interval: 60s
    lambda: return id(ufh_ctl).pump_today_h();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 8
  - platform: template
    name: "Pump Runtime Total"
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    icon: mdi:timer-sand
    entity_category: diagnostic
    update_interval: 300s
    lambda: return id(ufh_ctl).pump_total_h();
    web_server:
      sorting_group_id: group_pump
      sorting_weight: 9

button:
  - platform: template
    name: "All Zones Off"
    icon: mdi:radiator-off
    on_press:
      - lambda: id(ufh_ctl).all_zones_off();
    web_server:
      sorting_group_id: group_house

# Actions for Home Assistant (Developer tools -> Actions), e.g. esphome.<device>_set_zone_temperature
api:
  actions:
    # Temperature from any Home Assistant sensor (source "Home Assistant" in the wizard;
    # blueprint: blueprints/automation/esphome_ufh_temperature_from_ha.yaml)
    - action: set_zone_temperature
      variables: { zone: int, temperature: float }
      then:
        - lambda: id(ufh_ctl).ha_set_zone_temperature(zone, temperature);
    - action: set_floor_temperature
      variables: { zone: int, temperature: float }
      then:
        - lambda: id(ufh_ctl).ha_set_floor_temperature(zone, temperature);
    # Solar surplus (option "Solar surplus"): true while there is surplus
    - action: set_pv_surplus
      variables: { surplus: bool }
      then:
        - lambda: id(ufh_ctl).ha_set_pv_surplus(surplus);
    # mode: 0 = off, 1 = auto (schedule), 2 = heat (fixed target)
    - action: set_zone_mode
      variables: { zone: int, mode: int }
      then:
        - lambda: id(ufh_ctl).ha_set_zone_mode(zone, mode);
    - action: set_outdoor_temperature
      variables: { temperature: float }
      then:
        - lambda: id(ufh_ctl).ha_set_outdoor_temperature(temperature);
    - action: boost_zone
      variables: { zone: int, on: bool }
      then:
        - lambda: "id(ufh_ctl).boost_zone(zone, on ? 1 : 0);"
    - action: set_zone_target
      variables: { zone: int, temperature: float }
      then:
        - lambda: id(ufh_ctl).ha_set_zone_target(zone, temperature);
    - action: all_zones_off
      then:
        - lambda: id(ufh_ctl).all_zones_off();
