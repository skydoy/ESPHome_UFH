# OPTIONAL: run a zone's thermostat ON THE DEVICE (keeps heating with Home Assistant down).
# Not included by default. Add one per zone in your own (adopted) config, for example with a
# Home Assistant temperature sensor:
#
#   packages:
#     thermostat1: !include
#       file: github://skydoy/ESPHome_UFH/ufh/thermostat-zone.yaml@stable
#       vars: { zone: 1, room: "Living Room", temperature_entity: sensor.living_room_temperature }
#
# or point "temperature_sensor" at a local probe (e.g. a DS18B20 on ${onewire_pin}), see
# docs/configuration.md. The climate entity then switches "Zone N" by itself; leave the zone
# switch alone in Home Assistant (set the target temperature on the climate entity instead).
#
# Vars: zone (number), room (name shown in Home Assistant), temperature_entity (HA sensor).
sensor:
  - platform: homeassistant
    id: zone${zone}_temperature
    name: "Zone ${zone} Temperature"
    entity_id: ${temperature_entity}
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: true

climate:
  - platform: thermostat
    id: zone${zone}_thermostat
    name: "${room}"
    icon: mdi:home-thermometer-outline
    sensor: zone${zone}_temperature
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 60s
    heat_deadband: 0.3
    heat_overrun: 0.2
    visual:
      min_temperature: 5
      max_temperature: 28
      temperature_step: 0.5
    default_preset: Comfort
    on_boot_restore_from: memory
    preset:
      - name: Comfort
        default_target_temperature_low: 21
      - name: Eco
        default_target_temperature_low: 18
      - name: Away
        default_target_temperature_low: 12
    heat_action:
      - switch.turn_on: zone${zone}
    idle_action:
      - switch.turn_off: zone${zone}
    web_server:
      sorting_group_id: group_zones
