# Example of an ADOPTED config with on-device thermostats for two zones (optional).
# Copy what you need into the YAML the ESPHome Device Builder created when you adopted the
# device, and press Install. Each thermostat switches its "Zone N" relay by itself, so heating
# keeps working even when Home Assistant is down (it only needs HA for the temperature here).
substitutions:
  name: esphome-ufh-01a2b3
  friendly_name: Piso radiante

packages:
  ufh: !include ../devices/ufh-s3-eth.yaml
  # In your adopted config use github://skydoy/ESPHome_UFH/ufh/thermostat-zone.yaml@stable
  thermostat1: !include
    file: ../ufh/thermostat-zone.yaml
    vars: { zone: 1, room: "Living Room", temperature_entity: sensor.living_room_temperature }
  thermostat2: !include
    file: ../ufh/thermostat-zone.yaml
    vars: { zone: 2, room: "Kitchen", temperature_entity: sensor.kitchen_temperature }

esphome:
  name: ${name}
  name_add_mac_suffix: false

api:
  encryption:
    key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="   # use the key the Device Builder made
