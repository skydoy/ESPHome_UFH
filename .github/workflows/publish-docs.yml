name: Publish documentation

# Docs only. Keeps the firmware binaries, OTA manifests, and installer HTML
# that are already on GitHub Pages, then adds the MkDocs site at /docs/.
# A firmware release still goes through publish.yml on a v* tag (or an automatic
# release). This workflow does not build firmware, create a tag, or move stable.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - overrides/**
      - requirements-docs.txt
      - tools/assemble-docs-site.sh
      - .github/workflows/publish-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    # GitHub Pages keeps serving the FIRST deployment of a commit: a second deployment of the
    # same commit reports success but is not served. When this commit is (or is about to be)
    # a release, publish.yml deploys it with the new firmware and the docs, so skip here;
    # otherwise this docs-only deployment would hide the release installer.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: decide
        run: |
          v=$(grep -oP '^\s*project_version: "\K[^"]+' devices/ufh-p4-poe.yaml)
          tag_sha=$(git ls-remote --tags origin "refs/tags/v$v^{}" "refs/tags/v$v" | head -n 1 | cut -f1)
          if [ -z "$tag_sha" ]; then
            echo "v$v is not tagged yet: Auto release will publish this commit."; echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/v$v^{}" "refs/tags/v$v" | cut -f1 | grep -qx "$GITHUB_SHA"; then
            echo "This commit is release v$v: publish.yml deploys it."; echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Assemble live installer plus docs
        run: bash tools/assemble-docs-site.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
