name: Build firmware & publish installer
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  meta:
    # Decides whether this run is a RELEASE. Automatic: a push to main whose project_version
    # (devices/ufh-p4-poe.yaml) has no v<version> tag yet is released by this same run (tag,
    # GitHub Release, Pages, stable). Pushing a v* tag by hand still works too.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        run: |
          ver=$(grep -oP '^\s*project_version: "\K[^"]+' devices/ufh-p4-poe.yaml)
          rel=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            rel=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
              echo "v$ver already released: build only"
            else
              rel=true; echo "New version v$ver: releasing"
            fi
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
  build:
    needs: meta
    # One installer build per board; each board has its own folder (and manifest.json) on
    # GitHub Pages (firmware/p4-poe/). The installer firmware is built from the
    # *.factory.yaml (base config + "Firmware Update" entity).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: p4-poe
            base: devices/ufh-p4-poe.yaml
            factory: devices/ufh-p4-poe.factory.yaml
            site_dir: firmware/p4-poe
          - key: p4-poe-direct
            base: devices/ufh-p4-poe-direct.yaml
            factory: devices/ufh-p4-poe-direct.factory.yaml
            site_dir: firmware/p4-poe-direct
    env:
      BASE_YAML: ${{ matrix.base }}
      DEVICE_YAML: ${{ matrix.factory }}
      SITE_DIR: ${{ matrix.site_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tag must match project_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "^\s*project_version: \"${GITHUB_REF_NAME#v}\"$" "$BASE_YAML" || {
            echo "::error::$BASE_YAML project_version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Record the build source (shown in the "Firmware Version" sensor)
        run: |
          if [[ "${{ needs.meta.outputs.release }}" == true ]]; then src="release"; else src="${GITHUB_REF_NAME} @${GITHUB_SHA::7}"; fi
          sed -i "s|^\(\s*firmware_source:\).*|\1 \"$src\"|" "$BASE_YAML"
          # build the "ufh" component from this commit, not from the stable branch
          sed -i "s|^\(\s*ufh_components:\).*|\1 ../components|" "$BASE_YAML"
          grep -n "firmware_source:\|project_version:\|ufh_components:" "$BASE_YAML"
      - id: esphome
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: ${{ env.DEVICE_YAML }}
          version: "2026.11.0"
          complete-manifest: true
          release-url: ${{ github.server_url }}/${{ github.repository }}/releases
      - name: Stage the firmware in its Pages folder
        run: |
          mkdir -p "out/$SITE_DIR"
          cp -r "${{ steps.esphome.outputs.name }}"/* "out/$SITE_DIR/"
          ls -R out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fw-${{ matrix.key }}
          path: out
          if-no-files-found: error
  pages:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fw-*
          merge-multiple: true
          path: site
      - name: Assemble Pages site
        run: |
          cp -r static/. site/
          ls -R site
          test -f site/firmware/p4-poe/manifest.json
          test -f site/firmware/p4-poe-direct/manifest.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Build documentation (MkDocs → site/docs)
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict -d site/docs
          test -f site/docs/index.html
          test -f site/docs/pt/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    # Publish the installer and the OTA manifests only for release tags (or a manual run), so
    # devices in the field only ever see releases.
    if: needs.meta.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs: [meta, pages]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  release:
    # GitHub Release for a v* tag: notes from CHANGELOG.md, firmware images attached.
    if: needs.meta.outputs.release == 'true'
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fw-*
          merge-multiple: true
          path: fw
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f&&/^\[[^]]+\]: /{exit} f{print}' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No '## [$v]' section in CHANGELOG.md"
            echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          fi
          sed -i -E "s#\]\(([^):#][^):]*)\)#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" notes.md
          {
            echo
            echo "---"
            echo "**Install or update:** use the [web installer](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/) (Chrome or Edge)."
            echo "Boards already running this firmware update over the network from the **Firmware Update** entity."
            echo "\`*.factory.bin\` is the full image for a first USB flash at offset 0x0; \`*.ota.bin\` is for manual OTA uploads."
          } >> notes.md
          cat notes.md
      - name: Prepare assets
        run: |
          mkdir assets
          for d in p4-poe p4-poe-direct; do
            for f in $(find "fw/firmware/$d" -name '*.factory.bin' -o -name '*.ota.bin' | sort); do
              b=$(basename "$f"); cp "$f" "assets/esphome-ufh-$d-${TAG}.${b#*.}"
            done
          done
          test "$(ls assets | wc -l)" -ge 4
          (cd assets && sha256sum * > SHA256SUMS.txt)
          ls -l assets && cat assets/SHA256SUMS.txt
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            # Creates the tag on this commit when it does not exist yet (automatic release).
            gh release create "$TAG" assets/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
  stable:
    # Move the "stable" branch to this release tag. Adopted Device Builder configs import
    # devices/ufh-p4-poe.yaml@stable, so "Install" builds the latest release.
    if: needs.meta.outputs.release == 'true'
    needs: [meta, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Point refs/heads/stable at the tag commit
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$GITHUB_SHA"
          fi
          echo "stable -> ${{ needs.meta.outputs.tag }} ($GITHUB_SHA)"
