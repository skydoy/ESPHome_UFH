name: Diagnostic firmware
# Minimal firmware (board + Ethernet + logs) to tell a hardware / Ethernet problem apart from a
# problem in the UFH firmware. Download the "ufh-diag" artifact and flash the .factory.bin with
# https://web.esphome.io (Connect -> Install -> choose file).
on:
  push:
    branches: [dev]
    paths: [devices/ufh-diag.yaml, .github/workflows/diag.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: esphome
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: devices/ufh-diag.yaml
          version: "2026.10.1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ufh-diag
          path: ${{ steps.esphome.outputs.name }}
          if-no-files-found: error
