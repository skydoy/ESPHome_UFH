name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device:
          - devices/ufh-p4-poe.yaml
          - devices/ufh-p4-poe.factory.yaml
          - devices/ufh-p4-poe-direct.yaml
          - devices/ufh-p4-poe-direct.factory.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.11.0
      - name: esphome config (ufh component from this commit)
        run: |
          set -o pipefail
          esphome -s ufh_components ../components config ${{ matrix.device }} | tee config.txt
      - name: Only the factory firmware has the "Firmware Update" entity
        run: |
          if [[ "${{ matrix.device }}" == *.factory.yaml ]]; then
            grep -q "id: firmware_update" config.txt
            if grep -q "id: update_check$" config.txt; then
              echo "::error::Factory configs must drop core/update-check.yaml"; exit 1; fi
          else
            if grep -qE "id: (firmware_update|ota_http)$" config.txt; then
              echo "::error::Base configs (adopted in the Device Builder) must not include auto-update"; exit 1; fi
            grep -q "id: check_for_update" config.txt
          fi
  web-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: web-ui.js parses
        run: node -e "new Function(require('fs').readFileSync('core/web-ui.js','utf8'))"
  pinned-refs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Adoption and components follow @stable; no @main in shipped configs
        run: |
          set -e
          for f in devices/ufh-p4-poe.yaml devices/ufh-p4-poe-direct.yaml; do
            grep -q "package_import_url: github://skydoy/ESPHome_UFH/$f@stable$" "$f"
            grep -q "ufh_components: github://skydoy/ESPHome_UFH@stable$" "$f"
            v=$(grep -oP '^\s*project_version: "\K[^"]+' "$f"); echo "$f $v"
          done
          test "$(grep -hoP '^\s*project_version: "\K[^"]+' devices/ufh-p4-poe.yaml)" = \
               "$(grep -hoP '^\s*project_version: "\K[^"]+' devices/ufh-p4-poe-direct.yaml)"
          if grep -rn "@main" devices core ufh components; then echo "::error::no @main refs"; exit 1; fi

  packet-rx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: packet_rx host test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components/ufh tools/test_udp_packet.cpp -o test_udp_packet
          ./test_udp_packet
      - name: Python packet test
        run: python3 tools/test_udp_packet.py
