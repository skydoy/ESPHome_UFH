name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: input
    id: hardware
    attributes:
      label: Relay board and actuators
      placeholder: "16-channel 12 V relay board, 230 V NC thermal actuators"
  - type: input
    id: firmware
    attributes:
      label: Firmware Version (from the device's diagnostic entities)
  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options: ["Web installer", "Adopted in the ESPHome Device Builder", "Own YAML"]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From http://<device-ip>/ or the Device Builder.
      render: text
