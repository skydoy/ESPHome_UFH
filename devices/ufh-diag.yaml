# DIAGNOSTIC firmware (not for normal use): only the M5Stack Unit PoE-P4 board, Ethernet,
# logs and OTA. No UFH component, no MQTT, no relays. Used to tell an Ethernet /
# board problem apart from a problem in the UFH firmware.
esphome:
  name: ufh-diag
  name_add_mac_suffix: true

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  speed: 200MHz

logger:
  level: VERBOSE
  hardware_uart: USB_SERIAL_JTAG
  logs:
    component: DEBUG

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  power_pin: GPIO51

api:
  reboot_timeout: 0s
ota:
  - platform: esphome
web_server:
  port: 80
debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: ethernet_info
    ip_address:
      name: "IP Address"

output:
  - { platform: ledc, id: led_r, pin: GPIO17 }
  - { platform: ledc, id: led_g, pin: GPIO15 }
  - { platform: ledc, id: led_b, pin: GPIO16 }

light:
  - platform: rgb
    id: status_rgb
    red: led_r
    green: led_g
    blue: led_b
    default_transition_length: 0s

interval:
  - interval: 2s
    then:
      - lambda: |-
          // purple = diagnostic firmware running; green = network up
          static bool shown = false;
          bool up = network::is_connected();
          auto call = id(status_rgb).make_call();
          call.set_state(true);
          call.set_brightness(0.3);
          if (up) call.set_rgb(0, 1, 0); else call.set_rgb(0.6, 0, 1);
          call.perform();
          if (!shown && up) { shown = true; ESP_LOGI("diag", "Network up"); }
