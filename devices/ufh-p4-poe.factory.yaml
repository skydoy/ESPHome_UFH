# FACTORY firmware: ESPHome UFH, M5Stack Unit PoE-P4 + MCP23017 (16 relays).
# Built by GitHub Actions for the web installer: the base config plus a "Firmware Update" entity
# that installs new releases from GitHub Pages. Do not adopt or include this file in your own
# config (adopting imports the base file, see dashboard_import there).
packages:
  device: !include ufh-p4-poe.yaml
  auto_update: !include ../core/auto-update.yaml
