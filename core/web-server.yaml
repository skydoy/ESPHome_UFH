# Local web page at http://<device-ip>/ : setup wizard, live diagram, zones, schedules, logs.
# Version 3 UI served from the ESPHome CDN (little flash). NO authentication: anyone on the LAN
# can switch zones and the pump. To add a login set `web_server: auth:` in your own config; to
# remove the page, override the package with `web_server: !remove`. See docs/configuration.md.
# web-ui.js: project favicon, caps the debug log panel height, PT/EN language toggle.
# Path resolves next to this file; only one js_include is allowed — merge here.
web_server:
  port: 80
  version: 3
  log: true
  js_include: web-ui.js
  sorting_groups:
    - id: group_zones
      name: "Zones"
      sorting_weight: 10
    - id: group_house
      name: "House"
      sorting_weight: 5
    - id: group_stats
      name: "Statistics"
      sorting_weight: 40
    - id: group_maintenance
      name: "Maintenance"
      sorting_weight: 90
