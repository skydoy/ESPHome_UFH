# Board: M5Stack Unit PoE-P4 (SKU U213): ESP32-P4NRW32, 16 MB flash, 32 MB PSRAM, IP101GRI
# Ethernet PHY (RMII), PoE IEEE 802.3at (6 W). Comes in its own case (64 x 24 x 20 mm).
# The relays are added by one of the packages in core/relays/.
#
# No radio: the ESP32-P4 has no Wi-Fi and no Bluetooth (BTHome sensors are not available;
# Shelly H&T webhooks, Home Assistant, MQTT and DS18B20 all work).
#
# Fixed on the board:  GPIO28-31/34/35/49-52 Ethernet · GPIO15/16/17 RGB LED (G/B/R) ·
# GPIO45 button · GPIO14 IR · GPIO24/25 USB-C (download / logs) · GPIO0-4/18/33/36 display
# and camera connectors · GPIO34-38 strapping.
# Free for relays: Hat2-Bus G44 G43 G21 G42 G20 G41 G19 G40 G39 G23 G22 ·
# SDIO header G13 G12 G11 G10 G9 G8 · Grove (PORT.CUSTOM) G53 G54.
#
# Chip revision: the Unit PoE-P4 sold so far has an ESP32-P4 rev v1.3 ("engineering_sample"
# in ESPHome = anything before rev v3). Firmware for v1.x and v3.x is not interchangeable.
substitutions:
  http_verify_ssl: "true"

esp32:
  variant: esp32p4
  engineering_sample: true   # ESP32-P4 rev v1.x (Unit PoE-P4). A future "PoE-P4X" (rev v3) needs false.
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  speed: 200MHz

# Logs go to the USB-C "download" port (USB Serial/JTAG).
logger:
  hardware_uart: USB_SERIAL_JTAG

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  power_pin: GPIO51

# RGB LED (three separate pins): green = Home Assistant connected, blue = network without
# Home Assistant, red = no network. "Status LED" (config) turns it off.
output:
  - { platform: ledc, id: led_r, pin: GPIO17 }
  - { platform: ledc, id: led_g, pin: GPIO15 }
  - { platform: ledc, id: led_b, pin: GPIO16 }

light:
  - platform: rgb
    id: status_rgb
    name: "Status LED"
    icon: mdi:led-on
    entity_category: config
    red: led_r
    green: led_g
    blue: led_b
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: group_maintenance

interval:
  - interval: 5s
    then:
      - lambda: |-
          if (!id(status_rgb).current_values.is_on()) return;
          float r = 0, g = 0, b = 0;
          if (api::global_api_server != nullptr && api::global_api_server->is_connected()) g = 1;
          else if (network::is_connected()) b = 1;
          else r = 1;
          auto cv = id(status_rgb).current_values;
          if (cv.get_red() == r && cv.get_green() == g && cv.get_blue() == b) return;
          auto call = id(status_rgb).make_call();
          call.set_rgb(r, g, b);
          call.set_brightness(0.25);
          call.perform();
