# Board: Waveshare ESP32-S3-ETH (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM), W5500 Ethernet,
# optional PoE Module (B) on top. The relays are added by one of the packages in core/relays/.
#
# Fixed on the board:  GPIO9-14 W5500 (RST, INT, MOSI, MISO, SCLK, CS) · GPIO21 RGB LED ·
# GPIO4-7 TF card · GPIO33-37 octal PSRAM · GPIO19/20 USB · GPIO0/3/45/46 strapping.
substitutions:
  http_verify_ssl: "true"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Logs go to the USB-C port (USB Serial/JTAG), so GPIO43/44 (UART0) are free for I/O.
logger:
  hardware_uart: USB_SERIAL_JTAG

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

# On-board RGB LED: green = Home Assistant connected, blue = network without Home Assistant,
# red = no network. "Status LED" (config) turns it off.
light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: "Status LED"
    icon: mdi:led-on
    entity_category: config
    pin: GPIO21
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB   # if green and red look swapped on your board, use RGB
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: group_maintenance

interval:
  - interval: 5s
    then:
      - lambda: |-
          if (!id(status_rgb).current_values.is_on()) return;
          float r = 0, g = 0, b = 0;
          if (api::global_api_server != nullptr && api::global_api_server->is_connected()) g = 1;
          else if (network::is_connected()) b = 1;
          else r = 1;
          auto cv = id(status_rgb).current_values;
          if (cv.get_red() == r && cv.get_green() == g && cv.get_blue() == b) return;
          auto call = id(status_rgb).make_call();
          call.set_rgb(r, g, b);
          call.set_brightness(0.25);
          call.perform();
