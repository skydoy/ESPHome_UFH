# Relays through an MCP23017 I/O expander (I2C): up to 16 relays, any 16-channel relay board.
# MCP23017 channel N-1 drives relay N (GPA0 = relay 1 ... GPB7 = relay 16).
# Opto-isolated boards that switch on with a LOW input: choose LOW in the setup wizard
# (default here). Wiring: docs/wiring.md. 1-Wire probes (DS18B20): GPIO15.
substitutions:
  board_label: "Waveshare ESP32-S3-ETH · MCP23017 (16 relays)"
  i2c_sda: GPIO16
  i2c_scl: GPIO17
  mcp23017_address: "0x20"
  onewire_pin: GPIO15
  relays_active_low: "true"

i2c:
  id: i2c_bus
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: 100kHz
  scan: true

mcp23017:
  - id: relays
    address: ${mcp23017_address}

output:
  - { platform: gpio, id: relay_1, pin: { mcp23xxx: relays, number: 0, mode: { output: true } } }
  - { platform: gpio, id: relay_2, pin: { mcp23xxx: relays, number: 1, mode: { output: true } } }
  - { platform: gpio, id: relay_3, pin: { mcp23xxx: relays, number: 2, mode: { output: true } } }
  - { platform: gpio, id: relay_4, pin: { mcp23xxx: relays, number: 3, mode: { output: true } } }
  - { platform: gpio, id: relay_5, pin: { mcp23xxx: relays, number: 4, mode: { output: true } } }
  - { platform: gpio, id: relay_6, pin: { mcp23xxx: relays, number: 5, mode: { output: true } } }
  - { platform: gpio, id: relay_7, pin: { mcp23xxx: relays, number: 6, mode: { output: true } } }
  - { platform: gpio, id: relay_8, pin: { mcp23xxx: relays, number: 7, mode: { output: true } } }
  - { platform: gpio, id: relay_9, pin: { mcp23xxx: relays, number: 8, mode: { output: true } } }
  - { platform: gpio, id: relay_10, pin: { mcp23xxx: relays, number: 9, mode: { output: true } } }
  - { platform: gpio, id: relay_11, pin: { mcp23xxx: relays, number: 10, mode: { output: true } } }
  - { platform: gpio, id: relay_12, pin: { mcp23xxx: relays, number: 11, mode: { output: true } } }
  - { platform: gpio, id: relay_13, pin: { mcp23xxx: relays, number: 12, mode: { output: true } } }
  - { platform: gpio, id: relay_14, pin: { mcp23xxx: relays, number: 13, mode: { output: true } } }
  - { platform: gpio, id: relay_15, pin: { mcp23xxx: relays, number: 14, mode: { output: true } } }
  - { platform: gpio, id: relay_16, pin: { mcp23xxx: relays, number: 15, mode: { output: true } } }

one_wire:
  - platform: gpio
    id: ow_bus
    pin: ${onewire_pin}

ufh:
  id: ufh_ctl
  board_name: ${board_label}
  time_id: sntp_time
  relays_active_low: ${relays_active_low}
  one_wire_id: ow_bus
  esp32_ble_id: ble_tracker
  relays: [relay_1, relay_2, relay_3, relay_4, relay_5, relay_6, relay_7, relay_8, relay_9,
           relay_10, relay_11, relay_12, relay_13, relay_14, relay_15, relay_16]

packages:
  zones: !include ../../ufh/zones-16.yaml
