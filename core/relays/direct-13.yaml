# Relays driven DIRECTLY by the ESP32-S3 (no expander): up to 13 relays.
# Made for relay boards with 3.3 V logic inputs, e.g. the Denkovi boards that came with the
# DAEnetIP4 (its outputs were 0 / 3.3 V). Relay N = relayN_pin. Free GPIOs of the
# Waveshare ESP32-S3-ETH (no camera fitted): 1, 2, 15-18, 38-42, 47, 48. Connect GND too.
# Whether a relay switches on with HIGH or LOW is chosen in the setup wizard (Denkovi: HIGH).
# 1-Wire probes (DS18B20): GPIO44 (UART0 RX, free because the logs use USB).
substitutions:
  board_label: "Waveshare ESP32-S3-ETH · direct GPIO (13 relays)"
  relay1_pin: GPIO1
  relay2_pin: GPIO2
  relay3_pin: GPIO15
  relay4_pin: GPIO16
  relay5_pin: GPIO17
  relay6_pin: GPIO18
  relay7_pin: GPIO38
  relay8_pin: GPIO39
  relay9_pin: GPIO40
  relay10_pin: GPIO41
  relay11_pin: GPIO42
  relay12_pin: GPIO47
  relay13_pin: GPIO48
  onewire_pin: GPIO44
  relays_active_low: "false"

output:
  - { platform: gpio, id: relay_1, pin: { number: "${relay1_pin}" } }
  - { platform: gpio, id: relay_2, pin: { number: "${relay2_pin}" } }
  - { platform: gpio, id: relay_3, pin: { number: "${relay3_pin}" } }
  - { platform: gpio, id: relay_4, pin: { number: "${relay4_pin}" } }
  - { platform: gpio, id: relay_5, pin: { number: "${relay5_pin}" } }
  - { platform: gpio, id: relay_6, pin: { number: "${relay6_pin}" } }
  - { platform: gpio, id: relay_7, pin: { number: "${relay7_pin}" } }
  - { platform: gpio, id: relay_8, pin: { number: "${relay8_pin}" } }
  - { platform: gpio, id: relay_9, pin: { number: "${relay9_pin}" } }
  - { platform: gpio, id: relay_10, pin: { number: "${relay10_pin}" } }
  - { platform: gpio, id: relay_11, pin: { number: "${relay11_pin}" } }
  - { platform: gpio, id: relay_12, pin: { number: "${relay12_pin}" } }
  - { platform: gpio, id: relay_13, pin: { number: "${relay13_pin}" } }

one_wire:
  - platform: gpio
    id: ow_bus
    pin: ${onewire_pin}

ufh:
  id: ufh_ctl
  board_name: ${board_label}
  time_id: sntp_time
  relays_active_low: ${relays_active_low}
  one_wire_id: ow_bus
  esp32_ble_id: ble_tracker
  relays: [relay_1, relay_2, relay_3, relay_4, relay_5, relay_6, relay_7, relay_8, relay_9,
           relay_10, relay_11, relay_12, relay_13]

packages:
  zones: !include ../../ufh/zones-13.yaml
