<text x="386" y="293" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pin 4  →  <tspan font-weight="bold">Relay 4</tspan></text>
<circle cx="410" cy="288" r="6" fill="#fff" stroke="#4363d8" stroke-width="3"/><line x1="416" y1="288" x2="784" y2="288" stroke="#4363d8" stroke-width="4"/><circle cx="790" cy="288" r="6" fill="#fff" stroke="#4363d8" stroke-width="3"/>
<text x="810" y="293" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pin 6  ·  G42</text>
<text x="386" y="329" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pin 5  →  <tspan font-weight="bold">Relay 5</tspan></text>
<circle cx="410" cy="324" r="6" fill="#fff" stroke="#911eb4" stroke-width="3"/><line x1="416" y1="324" x2="784" y2="324" stroke="#911eb4" stroke-width="4"/><circle cx="790" cy="324" r="6" fill="#fff" stroke="#911eb4" stroke-width="3"/>
