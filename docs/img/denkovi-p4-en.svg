<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1120" viewBox="0 0 1180 1120" font-family="Arial, Helvetica, sans-serif">
<rect width="1180" height="1120" fill="#ffffff"/>
<text x="30" y="42" font-size="25" font-weight="bold" fill="#0d1b2a">Denkovi relay board (12 relays) → M5Stack Unit PoE-P4</text>
<text x="30" y="68" font-size="14" fill="#555">Remove the DAEnetIP4. The wires go to the relay board sockets it plugged into: the middle 2×5 (“JP1”) and the long JP2 (where the DAEnetIP4 JP3 plugged in).</text>
<rect x="30" y="95" width="380" height="650" rx="12" fill="#f3f6fa" stroke="#0d1b2a" stroke-width="2"/>
<rect x="790" y="95" width="360" height="650" rx="12" fill="#f3f6fa" stroke="#0d1b2a" stroke-width="2"/>
<text x="46" y="125" font-size="18" fill="#0d1b2a" text-anchor="start" font-weight="bold">Relay board</text>
<text x="46" y="145" font-size="12" fill="#555" text-anchor="start" font-weight="normal">sockets the DAEnetIP4 plugged into</text>
<text x="806" y="125" font-size="18" fill="#0d1b2a" text-anchor="start" font-weight="bold">M5Stack Unit PoE-P4</text>
<text x="806" y="145" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Hat2-Bus and SDIO headers (2.54 mm)</text>
<text x="386" y="185" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pin 1  →  <tspan font-weight="bold">Relay 1</tspan></text>
<circle cx="410" cy="180" r="6" fill="#fff" stroke="#e6194b" stroke-width="3"/><line x1="416" y1="180" x2="784" y2="180" stroke="#e6194b" stroke-width="4"/><circle cx="790" cy="180" r="6" fill="#fff" stroke="#e6194b" stroke-width="3"/>
<text x="810" y="185" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pin 2  ·  G44</text>
<text x="386" y="221" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pin 2  →  <tspan font-weight="bold">Relay 2</tspan></text>
<circle cx="410" cy="216" r="6" fill="#fff" stroke="#3cb44b" stroke-width="3"/><line x1="416" y1="216" x2="784" y2="216" stroke="#3cb44b" stroke-width="4"/><circle cx="790" cy="216" r="6" fill="#fff" stroke="#3cb44b" stroke-width="3"/>
<text x="810" y="221" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pin 4  ·  G43</text>
<text x="386" y="257" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pin 3  →  <tspan font-weight="bold">Relay 3</tspan></text>
<circle cx="410" cy="252" r="6" fill="#fff" stroke="#f58231" stroke-width="3"/><line x1="416" y1="252" x2="784" y2="252" stroke="#f58231" stroke-width="4"/><circle cx="790" cy="252" r="6" fill="#fff" stroke="#f58231" stroke-width="3"/>
