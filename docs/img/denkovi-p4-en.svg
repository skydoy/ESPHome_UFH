<circle cx="410" cy="396" r="6" fill="#fff" stroke="#f032e6" stroke-width="3"/><line x1="416" y1="396" x2="784" y2="396" stroke="#f032e6" stroke-width="4"/><circle cx="790" cy="396" r="6" fill="#fff" stroke="#f032e6" stroke-width="3"/>
<text x="810" y="401" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pin 9  ·  G19</text>
<text x="386" y="437" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pin 8  →  <tspan font-weight="bold">Relay 8</tspan></text>
