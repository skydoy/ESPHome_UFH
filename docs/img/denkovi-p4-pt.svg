<circle cx="410" cy="468" r="6" fill="#fff" stroke="#800000" stroke-width="3"/><line x1="416" y1="468" x2="784" y2="468" stroke="#800000" stroke-width="4"/><circle cx="790" cy="468" r="6" fill="#fff" stroke="#800000" stroke-width="3"/>
<text x="810" y="473" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pino 12  ·  G39</text>
