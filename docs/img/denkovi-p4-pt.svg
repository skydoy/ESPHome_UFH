<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1120" viewBox="0 0 1180 1120" font-family="Arial, Helvetica, sans-serif">
<rect width="1180" height="1120" fill="#ffffff"/>
<text x="30" y="42" font-size="25" font-weight="bold" fill="#0d1b2a">Placa de relés Denkovi (12 relés) → M5Stack Unit PoE-P4</text>
<text x="30" y="68" font-size="14" fill="#555">Tira a DAEnetIP4. Os fios ligam às fichas fêmea da placa de relés onde ela encaixava: a 2×5 do meio (“JP1”) e a comprida JP2 (onde encaixava o JP3 da DAEnetIP4).</text>
<rect x="30" y="95" width="380" height="650" rx="12" fill="#f3f6fa" stroke="#0d1b2a" stroke-width="2"/>
<rect x="790" y="95" width="360" height="650" rx="12" fill="#f3f6fa" stroke="#0d1b2a" stroke-width="2"/>
<text x="46" y="125" font-size="18" fill="#0d1b2a" text-anchor="start" font-weight="bold">Placa de relés</text>
<text x="46" y="145" font-size="12" fill="#555" text-anchor="start" font-weight="normal">fichas onde encaixava a DAEnetIP4</text>
<text x="806" y="125" font-size="18" fill="#0d1b2a" text-anchor="start" font-weight="bold">M5Stack Unit PoE-P4</text>
<text x="806" y="145" font-size="12" fill="#555" text-anchor="start" font-weight="normal">fichas Hat2-Bus e SDIO (2,54 mm)</text>
<text x="386" y="185" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pino 1  →  <tspan font-weight="bold">Relé 1</tspan></text>
<circle cx="410" cy="180" r="6" fill="#fff" stroke="#e6194b" stroke-width="3"/><line x1="416" y1="180" x2="784" y2="180" stroke="#e6194b" stroke-width="4"/><circle cx="790" cy="180" r="6" fill="#fff" stroke="#e6194b" stroke-width="3"/>
<text x="810" y="185" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pino 2  ·  G44</text>
<text x="386" y="221" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pino 2  →  <tspan font-weight="bold">Relé 2</tspan></text>
<circle cx="410" cy="216" r="6" fill="#fff" stroke="#3cb44b" stroke-width="3"/><line x1="416" y1="216" x2="784" y2="216" stroke="#3cb44b" stroke-width="4"/><circle cx="790" cy="216" r="6" fill="#fff" stroke="#3cb44b" stroke-width="3"/>
<text x="810" y="221" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pino 4  ·  G43</text>
<text x="386" y="257" font-size="14" text-anchor="end" fill="#0d1b2a">JP1 (2×5) · pino 3  →  <tspan font-weight="bold">Relé 3</tspan></text>
<circle cx="410" cy="252" r="6" fill="#fff" stroke="#f58231" stroke-width="3"/><line x1="416" y1="252" x2="784" y2="252" stroke="#f58231" stroke-width="4"/><circle cx="790" cy="252" r="6" fill="#fff" stroke="#f58231" stroke-width="3"/>
<text x="810" y="257" font-size="14" fill="#0d1b2a" text-anchor="start" font-weight="normal">Hat2 · pino 5  ·  G21</text>
