<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 776" width="980" height="776" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="980" height="776" fill="#ffffff"/><text x="20" y="34" font-size="20" font-weight="700" fill="#0B1B3F">Relays straight on the ESP pins (up to 13)</text><text x="20" y="58" font-size="13" fill="#555">Wire by wire, from the ESP to the relay board inputs (where the DAEnetIP4 used to plug in). Connect GND too.</text><rect x="40" y="80" width="300" height="586" rx="12" fill="#f4f7fb" stroke="#0B1B3F" stroke-width="2"/><text x="54" y="106" font-size="15" font-weight="700" fill="#0B1B3F">M5Stack Unit PoE-P4</text><text x="54" y="124" font-size="12" fill="#555">Hat2-Bus and SDIO headers (2.54 mm)</text><rect x="640" y="80" width="300" height="586" rx="12" fill="#f4f7fb" stroke="#0B1B3F" stroke-width="2"/><text x="654" y="106" font-size="15" font-weight="700" fill="#0B1B3F">Relay board</text><text x="654" y="124" font-size="12" fill="#555">e.g. Denkovi (3.3 V inputs)</text><circle cx="340" cy="150" r="5" fill="#fff" stroke="#e6194b" stroke-width="2"/><text x="330" y="154" font-size="12" text-anchor="end" fill="#222">Hat2 2  ·  G44</text><circle cx="640" cy="150" r="5" fill="#fff" stroke="#e6194b" stroke-width="2"/><text x="650" y="154" font-size="12" text-anchor="start" fill="#222">IN1  →  relay 1</text><path d="M345 150 C490.0 150 490.0 150 635 150" fill="none" stroke="#e6194b" stroke-width="3"/><circle cx="340" cy="184" r="5" fill="#fff" stroke="#3cb44b" stroke-width="2"/><text x="330" y="188" font-size="12" text-anchor="end" fill="#222">Hat2 4  ·  G43</text><circle cx="640" cy="184" r="5" fill="#fff" stroke="#3cb44b" stroke-width="2"/><text x="650" y="188" font-size="12" text-anchor="start" fill="#222">IN2  →  relay 2</text><path d="M345 184 C490.0 184 490.0 184 635 184" fill="none" stroke="#3cb44b" stroke-width="3"/><circle cx="340" cy="218" r="5" fill="#fff" stroke="#f58231" stroke-width="2"/><text x="330" y="222" font-size="12" text-anchor="end" fill="#222">Hat2 5  ·  G21</text><circle cx="640" cy="218" r="5" fill="#fff" stroke="#f58231" stroke-width="2"/><text x="650" y="222" font-size="12" text-anchor="start" fill="#222">IN3  →  relay 3</text><path d="M345 218 C490.0 218 490.0 218 635 218" fill="none" stroke="#f58231" stroke-width="3"/><circle cx="340" cy="252" r="5" fill="#fff" stroke="#4363d8" stroke-width="2"/><text x="330" y="256" font-size="12" text-anchor="end" fill="#222">Hat2 6  ·  G42</text><circle cx="640" cy="252" r="5" fill="#fff" stroke="#4363d8" stroke-width="2"/><text x="650" y="256" font-size="12" text-anchor="start" fill="#222">IN4  →  relay 4</text><path d="M345 252 C490.0 252 490.0 252 635 252" fill="none" stroke="#4363d8" stroke-width="3"/><circle cx="340" cy="286" r="5" fill="#fff" stroke="#911eb4" stroke-width="2"/><text x="330" y="290" font-size="12" text-anchor="end" fill="#222">Hat2 7  ·  G20</text><circle cx="640" cy="286" r="5" fill="#fff" stroke="#911eb4" stroke-width="2"/><text x="650" y="290" font-size="12" text-anchor="start" fill="#222">IN5  →  relay 5</text><path d="M345 286 C490.0 286 490.0 286 635 286" fill="none" stroke="#911eb4" stroke-width="3"/><circle cx="340" cy="320" r="5" fill="#fff" stroke="#46a0a0" stroke-width="2"/><text x="330" y="324" font-size="12" text-anchor="end" fill="#222">Hat2 8  ·  G41</text><circle cx="640" cy="320" r="5" fill="#fff" stroke="#46a0a0" stroke-width="2"/><text x="650" y="324" font-size="12" text-anchor="start" fill="#222">IN6  →  relay 6</text><path d="M345 320 C490.0 320 490.0 320 635 320" fill="none" stroke="#46a0a0" stroke-width="3"/><circle cx="340" cy="354" r="5" fill="#fff" stroke="#f032e6" stroke-width="2"/><text x="330" y="358" font-size="12" text-anchor="end" fill="#222">Hat2 9  ·  G19</text><circle cx="640" cy="354" r="5" fill="#fff" stroke="#f032e6" stroke-width="2"/><text x="650" y="358" font-size="12" text-anchor="start" fill="#222">IN7  →  relay 7</text><path d="M345 354 C490.0 354 490.0 354 635 354" fill="none" stroke="#f032e6" stroke-width="3"/><circle cx="340" cy="388" r="5" fill="#fff" stroke="#9a6324" stroke-width="2"/><text x="330" y="392" font-size="12" text-anchor="end" fill="#222">Hat2 10  ·  G40</text><circle cx="640" cy="388" r="5" fill="#fff" stroke="#9a6324" stroke-width="2"/><text x="650" y="392" font-size="12" text-anchor="start" fill="#222">IN8  →  relay 8</text><path d="M345 388 C490.0 388 490.0 388 635 388" fill="none" stroke="#9a6324" stroke-width="3"/><circle cx="340" cy="422" r="5" fill="#fff" stroke="#800000" stroke-width="2"/><text x="330" y="426" font-size="12" text-anchor="end" fill="#222">Hat2 12  ·  G39</text><circle cx="640" cy="422" r="5" fill="#fff" stroke="#800000" stroke-width="2"/><text x="650" y="426" font-size="12" text-anchor="start" fill="#222">IN9  →  relay 9</text><path d="M345 422 C490.0 422 490.0 422 635 422" fill="none" stroke="#800000" stroke-width="3"/><circle cx="340" cy="456" r="5" fill="#fff" stroke="#008080" stroke-width="2"/><text x="330" y="460" font-size="12" text-anchor="end" fill="#222">Hat2 14  ·  G23</text><circle cx="640" cy="456" r="5" fill="#fff" stroke="#008080" stroke-width="2"/><text x="650" y="460" font-size="12" text-anchor="start" fill="#222">IN10  →  relay 10</text><path d="M345 456 C490.0 456 490.0 456 635 456" fill="none" stroke="#008080" stroke-width="3"/><circle cx="340" cy="490" r="5" fill="#fff" stroke="#000075" stroke-width="2"/><text x="330" y="494" font-size="12" text-anchor="end" fill="#222">Hat2 16  ·  G22</text><circle cx="640" cy="490" r="5" fill="#fff" stroke="#000075" stroke-width="2"/><text x="650" y="494" font-size="12" text-anchor="start" fill="#222">IN11  →  relay 11</text><path d="M345 490 C490.0 490 490.0 490 635 490" fill="none" stroke="#000075" stroke-width="3"/><circle cx="340" cy="524" r="5" fill="#fff" stroke="#808000" stroke-width="2"/><text x="330" y="528" font-size="12" text-anchor="end" fill="#222">SDIO 1  ·  G13</text><circle cx="640" cy="524" r="5" fill